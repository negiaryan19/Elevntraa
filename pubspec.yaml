name: medscribe
description: "AI-assisted prescription dictation for Indian doctors."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^17.3.0

  # Networking
  dio: ^5.7.0
  http_parser: ^4.0.0

  # Local DB
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Audio
  record: ^7.0.0
  just_audio: ^0.9.40
  permission_handler: ^11.3.1

  # Camera / gallery (scan previous reports)
  image_picker: ^1.1.2

  # PDF / sharing
  pdf: ^3.11.1
  printing: ^5.13.3
  url_launcher: ^6.3.1

  # Config / secure storage
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.3.1

  # Models / immutability
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Utility
  uuid: ^4.5.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3


flutter:
  uses-material-design: true
  assets:
    - .env
