name: rxvarta
description: "AI-assisted prescription dictation for Indian doctors."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Routing
  go_router: ^17.4.0

  # Networking
  connectivity_plus: ^7.3.2

  # Local DB
  drift: ^2.35.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0

  # Audio
  record: ^7.1.2
  just_audio: ^0.10.6
  permission_handler: ^12.0.3

  # Camera / gallery (scan previous reports)
  image_picker: ^1.2.4

  # PDF / sharing
  pdf: ^3.13.0
  printing: ^5.15.1
  url_launcher: ^6.3.3

  # Backend
  supabase_flutter: ^2.18.3
  # Keeps the Supabase session encrypted at rest (Keystore / Keychain).
  flutter_secure_storage: ^11.2.0

  # Models / immutability
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # UI
  google_fonts: ^8.2.1
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Utility
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  signature: ^6.4.0
  share_plus: ^13.3.1
  flutter_foreground_task: ^11.0.3
  package_info_plus: ^10.2.2
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.4


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/icd10_opd_map.json
    - assets/data/differential_rules.json
    - assets/data/drug_dictionary.json
    - assets/legal/
    - assets/fonts/
    - assets/brand/rxvarta_logo.png
  # The same bundled Noto fonts, registered with Flutter's text engine so
  # Indian-script text on the prescription PDF is shaped correctly (see
  # PdfShaper), whatever fonts the phone has.
  fonts:
    - family: RxNotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: RxNotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: RxNotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: RxNotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
        - asset: assets/fonts/NotoSansGujarati-Bold.ttf
          weight: 700
    - family: RxNotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada-Regular.ttf
        - asset: assets/fonts/NotoSansKannada-Bold.ttf
          weight: 700
    - family: RxNotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
    - family: RxNotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon_fullbleed.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
