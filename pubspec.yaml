name: rxvarta
description: "AI-assisted prescription dictation for Indian doctors."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.3.0

  # Networking
  dio: ^5.7.0
  http_parser: ^4.0.0

  # Local DB
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4
  path: ^1.9.0

  # Audio
  record: ^7.0.0
  just_audio: ^0.10.5
  permission_handler: ^12.0.3

  # Camera / gallery (scan previous reports)
  image_picker: ^1.1.2

  # PDF / sharing
  pdf: ^3.11.1
  printing: ^5.13.3
  url_launcher: ^6.3.1

  # Config / secure storage
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.3.1

  # Models / immutability
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # UI
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Utility
  uuid: ^4.5.0
  collection: ^1.18.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  drift_dev: ^2.34.0
  mockito: ^5.4.4


flutter:
  uses-material-design: true
  assets:
    - .env
