name: rxvarta
description: "AI-assisted prescription dictation for Indian doctors."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.2

  # Routing
  go_router: ^17.4.0

  # Networking
  dio: ^5.11.0
  http_parser: ^4.0.0
  connectivity_plus: ^7.3.1

  # Local DB
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0

  # Audio
  record: ^7.1.1
  just_audio: ^0.10.6
  permission_handler: ^12.0.3

  # Camera / gallery (scan previous reports)
  image_picker: ^1.2.3

  # PDF / sharing
  pdf: ^3.13.0
  printing: ^5.15.0
  url_launcher: ^6.3.1

  # Backend
  supabase_flutter: ^2.17.1

  # Config / secure storage
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.3.1

  # Models / immutability
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # UI
  google_fonts: ^8.2.1
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Utility
  uuid: ^4.6.0
  collection: ^1.18.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  drift_dev: ^2.34.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4


flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/data/icd10_opd_map.json
    - assets/data/differential_rules.json
    - assets/data/drug_dictionary.json

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon_fullbleed.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon_fullbleed.png"
