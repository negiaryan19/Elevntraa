name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN; jobs widen this only if needed.
permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.1"

# Actions are pinned to commit SHAs (with the human-readable tag in a comment)
# to prevent tag-retargeting supply-chain attacks. Bump via Dependabot.
jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Run the format check before code generation so we only validate
      # hand-written, committed source (generated files are gitignored).
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Generated freezed/json/drift sources (*.freezed.dart, *.g.dart) are
      # gitignored, so they must be generated in CI before analysis/tests,
      # otherwise model fields and copyWith appear "undefined".
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # flutter_dotenv loads a .env asset (declared in pubspec.yaml) at startup;
      # the widget/integration tests boot the app, so provide a placeholder.
      - name: Create placeholder .env
        run: |
          cat > .env <<'EOF'
          SARVAM_API_KEY=ci_placeholder
          GEMINI_API_KEY=ci_placeholder
          EOF

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated sources are gitignored; regenerate before building.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # The app reads keys from a .env asset declared in pubspec.yaml.
      # Provide a placeholder so the release build can bundle the asset in CI.
      # Real keys are injected at runtime / via signed release builds, not here.
      - name: Create placeholder .env
        run: |
          cat > .env <<'EOF'
          SARVAM_API_KEY=ci_placeholder
          GEMINI_API_KEY=ci_placeholder
          EOF

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action reads PR commits via the API; without these it fails
    # with "Resource not accessible by integration" (HTTP 403).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so gitleaks can scan all commits on the PR.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
