name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN; jobs widen this only if needed.
permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.1"

# Actions are pinned to commit SHAs (with the human-readable tag in a comment)
# to prevent tag-retargeting supply-chain attacks. Bump via Dependabot.
jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Run the format check before code generation so we only validate
      # hand-written, committed source (generated files are gitignored).
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Generated freezed/json/drift sources (*.freezed.dart, *.g.dart) are
      # gitignored, so they must be generated in CI before analysis/tests,
      # otherwise model fields and copyWith appear "undefined".
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Runtime configuration comes from --dart-define (see
      # config/app_config.example.json). Analysis and the widget tests run
      # without any backend: the app boots to the "not configured" login
      # screen, so no placeholder config is needed here.
      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The hosted image ships tens of GB of toolchains this build never
      # uses, and the Android build now runs out of disk without this
      # ("No space left on device" while packaging the APK).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated sources are gitignored; regenerate before building.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # The app reads its Supabase URL + publishable key at build time via
      # --dart-define-from-file (config/app_config.json is gitignored).
      # Empty values are fine for a CI build: the APK boots to the
      # "not configured" login screen. Real values come from the signed
      # release pipeline, never from this workflow.
      - name: Create placeholder app config
        run: |
          mkdir -p config
          cat > config/app_config.json <<'EOF'
          {
            "SUPABASE_URL": "",
            "SUPABASE_ANON_KEY": ""
          }
          EOF

      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=config/app_config.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Non-fatal: a full artifact storage quota should not block a green build.
        continue-on-error: true
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action reads PR commits via the API; without these it fails
    # with "Resource not accessible by integration" (HTTP 403).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so gitleaks can scan all commits on the PR.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Skip uploading the SARIF artifact — avoids failures when the
          # GitHub Actions artifact storage quota is exhausted. The scan
          # itself still runs and fails the job if secrets are detected.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
